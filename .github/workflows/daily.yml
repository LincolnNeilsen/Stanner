name: daily-ingest

on:
  schedule:
    - cron: "41 9 * * *"   # 09:41 UTC
  workflow_dispatch: {}

concurrency:
  group: bq-writes
  cancel-in-progress: false

# Keyless auth (Workload Identity Federation): GitHub's OIDC token is exchanged for
# short-lived Google credentials. No service account key exists anywhere.
permissions:
  contents: read
  id-token: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # healthchecks.io dead-man's switch: alerts if pings stop (job never ran) or a /fail arrives.
      HC_URL: ${{ secrets.DAILYINGEST }}
    steps:
      - name: Ping healthchecks (start)
        run: '[ -z "$HC_URL" ] || curl -fsS -m 10 --retry 3 "$HC_URL/start" || true'
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}
      - name: Ingest
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          BQ_DATASET: ${{ secrets.BQ_DATASET || 'artist_pipeline' }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SETLIST_FM_API_KEY: ${{ secrets.SETLIST_FM_API_KEY }}
          MUSICBRAINZ_USER_AGENT: ${{ secrets.MUSICBRAINZ_USER_AGENT || 'Stanner/0.1 (https://github.com/LincolnNeilsen/Stanner)' }}
        # musicbrainz first: it refreshes the artist tree the other source reads.
        run: python -m stanner run musicbrainz setlistfm
      - name: Ping healthchecks (success)
        if: success()
        run: '[ -z "$HC_URL" ] || curl -fsS -m 10 --retry 3 "$HC_URL" || true'
      - name: Ping healthchecks (fail)
        if: failure()
        run: '[ -z "$HC_URL" ] || curl -fsS -m 10 --retry 3 "$HC_URL/fail" || true'
