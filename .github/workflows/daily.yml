name: daily-ingest

on:
  schedule:
    - cron: "41 9 * * *"   # 09:41 UTC
  workflow_dispatch: {}

concurrency:
  group: bq-writes
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Ingest
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          BQ_DATASET: ${{ secrets.BQ_DATASET || 'artist_pipeline' }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SETLIST_FM_API_KEY: ${{ secrets.SETLIST_FM_API_KEY }}
          MUSICBRAINZ_USER_AGENT: ${{ secrets.MUSICBRAINZ_USER_AGENT || 'Stanner/0.1 (https://github.com/LincolnNeilsen/Stanner)' }}
        # musicbrainz first: it refreshes the artist tree the other source reads.
        run: python -m stanner run musicbrainz setlistfm
