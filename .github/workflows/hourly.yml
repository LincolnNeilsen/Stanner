name: hourly-ingest

on:
  schedule:
    - cron: "17 * * * *"   # off the top of the hour; GitHub cron can still run late
  workflow_dispatch: {}

# One writer at a time across both workflows (events is rewritten atomically per merge).
concurrency:
  group: bq-writes
  cancel-in-progress: false

# Keyless auth (Workload Identity Federation): GitHub's OIDC token is exchanged for
# short-lived Google credentials. No service account key exists anywhere.
permissions:
  contents: read
  id-token: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}
      - name: Ingest
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          BQ_DATASET: ${{ secrets.BQ_DATASET || 'artist_pipeline' }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          MUSICBRAINZ_USER_AGENT: ${{ secrets.MUSICBRAINZ_USER_AGENT || 'Stanner/0.1 (https://github.com/LincolnNeilsen/Stanner)' }}
        # ticketmaster: add back to this list once the developer account is approved
        run: python -m stanner run youtube news reddit
